name: Publish public Lightpanda repository

run-name: Publish Lightpanda ${{ inputs.release_tag }} to APT repository

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable browser release tag (for example v0.2.0).
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# All writers to this repository must use this group. Concurrency is not a FIFO queue.
concurrency:
  group: publish-lightpanda-apt
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUCKET: ${{ vars.APT_BUCKET }}
      APT_PUBLIC_URL: ${{ vars.APT_PUBLIC_URL }}
      APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

    steps:
      - name: Validate publishing configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BUCKET" ]; then
            echo "Set the APT_BUCKET repository variable." >&2
            exit 1
          fi

          if [ -z "$APT_PUBLIC_URL" ]; then
            echo "Set the APT_PUBLIC_URL repository variable." >&2
            exit 1
          fi

          if [ -z "$APT_SIGNING_FINGERPRINT" ]; then
            echo "Set the APT_SIGNING_FINGERPRINT repository variable." >&2
            exit 1
          fi

      - name: Checkout publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aptly gnupg dpkg-dev jq

      - name: Download stable release packages
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as 1.2.3 or v1.2.3." >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" --repo lightpanda-io/browser \
            --json isDraft,isPrerelease > release.json
          if ! jq --exit-status \
            '.isDraft == false and .isPrerelease == false' release.json; then
            echo "The requested tag must identify a published, non-prerelease release." >&2
            exit 1
          fi

          # Debian versions omit the optional leading v from the Git tag.
          version="${RELEASE_TAG#v}"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

          mkdir release-packages
          for arch in amd64 arm64; do
            gh release download "$RELEASE_TAG" --repo lightpanda-io/browser \
              --pattern "lightpanda_${version}_${arch}.deb" --dir release-packages
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          role-session-name: public-lightpanda-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Fetch existing package pool
        run: |
          mkdir -p previous/pool
          aws s3 sync \
            "s3://$BUCKET/pool/" \
            previous/pool/ \
            --only-show-errors

      - name: Sign and publish repository to S3
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/aptly-gpg.XXXXXX")"
          export GNUPGHOME

          cleanup() {
            gpgconf --homedir "$GNUPGHOME" --kill all || true
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup EXIT

          APT_PASSPHRASE_FILE="$(mktemp "$GNUPGHOME/passphrase.XXXXXX")"
          export APT_PASSPHRASE_FILE
          printf '%s' "$SIGNING_PASSPHRASE" > "$APT_PASSPHRASE_FILE"

          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          unset SIGNING_KEY SIGNING_PASSPHRASE

          bash scripts/publish-repository.sh "$PACKAGE_VERSION" release-packages previous/pool
